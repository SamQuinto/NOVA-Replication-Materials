<svg xmlns="http://www.w3.org/2000/svg" width="1170" height="1930" viewBox="0 0 1170 1930"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="540" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540" dy="0">A2 tutorial</tspan><tspan x="540" dy="39.06">Existing interpretation and scoring path</tspan></text><rect x="145" y="110" width="790" height="285" fill="white" stroke="black" stroke-width="1.8"/><text x="540.0" y="152" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Offer data and tutorial files</tspan></text><text x="172" y="195" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Offer text, recorded role and relevant context</tspan></text><text x="172" y="237" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Tutorial issue definitions and response format</tspan></text><text x="172" y="279" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Existing tutorial interpretation instructions</tspan></text><path d="M540,398 L540,435" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="145" y="440" width="790" height="205" fill="white" stroke="black" stroke-width="1.8"/><text x="540.0" y="482" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Python script A2-T1</tspan></text><text x="172" y="525" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Retrieves relevant tutorial issues and options</tspan></text><text x="172" y="567" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Builds the first model request (JSON)</tspan></text><path d="M540,648 L540,685" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="145" y="690" width="790" height="205" fill="white" stroke="black" stroke-width="1.8"/><text x="540.0" y="732" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Economical LLM</tspan></text><text x="172" y="775" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• OpenAI GPT-5.6 Luna at low reasoning</tspan></text><text x="172" y="817" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Returns the first interpretation (JSON)</tspan></text><path d="M540,898 L540,935" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="145" y="940" width="790" height="185" fill="white" stroke="black" stroke-width="1.8"/><text x="540.0" y="982" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Python script A2-T2</tspan></text><text x="172" y="1025" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Checks the existing dense-offer signal</tspan></text><text x="172" y="1067" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• If not dense, skips the second reading</tspan></text><path d="M540,1128 L540,1165" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><text x="558" y="1146.5" text-anchor="start" font-family="Arial, sans-serif" font-size="24"><tspan x="558" dy="0">Dense offer</tspan></text><rect x="145" y="1170" width="790" height="205" fill="white" stroke="black" stroke-width="1.8"/><text x="540.0" y="1212" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Optional second Luna call</tspan></text><text x="172" y="1255" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Independently rereads the original offer</tspan></text><text x="172" y="1297" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Checks completeness without seeing answer 1</tspan></text><path d="M540,1378 L540,1415" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="145" y="1420" width="790" height="220" fill="white" stroke="black" stroke-width="1.8"/><text x="540.0" y="1462" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Python script A2-T3</tspan></text><text x="172" y="1505" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Merges readings and flags disagreements</tspan></text><text x="172" y="1547" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Applies existing tutorial checks and scores</tspan></text><path d="M540,1643 L540,1680" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="145" y="1685" width="790" height="205" fill="white" stroke="black" stroke-width="3"/><text x="540.0" y="1727" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="540.0" dy="0">Scored offer (JSON)</tspan></text><text x="172" y="1770" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Interpreted terms and role-specific scores</tspan></text><text x="172" y="1812" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="172" dy="0">• Questions and ideas retained without points</tspan></text><path d="M935,1030 L1045,1030 L1045,1530 L935,1530" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><text x="1060" y="1260" text-anchor="start" font-family="Arial, sans-serif" font-size="24"><tspan x="1060" dy="0">Skip</tspan><tspan x="1060" dy="30.240000000000002">second</tspan><tspan x="1060" dy="30.240000000000002">call</tspan></text></svg>