<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1765" viewBox="0 0 1510 1765"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380" dy="0">A1  Flexible</tspan><tspan x="380" dy="39.06">Higher API cost</tspan></text><rect x="35" y="115" width="690" height="285" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Offer data and exercise files</tspan></text><text x="62" y="200" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Offer text and negotiator role (JSON)</tspan></text><text x="62" y="242" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Optional prior-offer context</tspan></text><text x="62" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Role materials and full table definitions</tspan></text><text x="62" y="326" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• General prompt and response format</tspan></text><path d="M380,403 L380,440" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="445" width="690" height="215" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Python script A1-1</tspan></text><text x="62" y="530" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Builds one model request (JSON)</tspan></text><text x="62" y="572" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Includes every active issue and option</tspan></text><text x="62" y="614" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Keeps score calculation in Python</tspan></text><path d="M380,663 L380,700" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="705" width="690" height="220" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="747" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Advanced LLM</tspan></text><text x="62" y="790" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• e.g., OpenAI GPT-6.1 Sol</tspan></text><text x="62" y="832" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Selects issues and options from the offer</tspan></text><text x="62" y="874" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Returns supporting words and questions</tspan></text><path d="M380,928 L380,965" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="970" width="690" height="220" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1012" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Interpretation (JSON)</tspan></text><text x="62" y="1055" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Issues, options and quoted evidence</tspan></text><text x="62" y="1097" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Clarification questions</tspan></text><text x="62" y="1139" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Ideas retained without points</tspan></text><path d="M380,1193 L380,1230" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="1235" width="690" height="230" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1277" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Python script A1-2</tspan></text><text x="62" y="1320" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Checks evidence, options and values</tspan></text><text x="62" y="1362" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Looks up researcher-defined scores</tspan></text><text x="62" y="1404" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Prepares totals and follow-up messages</tspan></text><path d="M380,1468 L380,1505" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="1510" width="690" height="220" fill="white" stroke="black" stroke-width="3"/><text x="380.0" y="1552" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Scored offer (JSON)</tspan></text><text x="62" y="1595" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Scores by issue and option</tspan></text><text x="62" y="1637" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Role-specific totals when complete</tspan></text><text x="62" y="1679" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Clarifications and unpriced ideas</tspan></text><text x="1130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130" dy="0">A2  Customized</tspan><tspan x="1130" dy="39.06">Higher setup effort, lower API cost</tspan></text><rect x="785" y="115" width="690" height="285" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Offer data and exercise files</tspan></text><text x="812" y="200" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Offer text and negotiator role (JSON)</tspan></text><text x="812" y="242" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Optional prior-offer context</tspan></text><text x="812" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Role materials and fitted reading rules</tspan></text><text x="812" y="326" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Scoring table, vocabulary and format</tspan></text><path d="M1130,403 L1130,440" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="445" width="690" height="215" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="487" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Python script A2-1</tspan></text><text x="812" y="530" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Retrieves likely relevant table entries</tspan></text><text x="812" y="572" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Builds a request with their options</tspan></text><text x="812" y="614" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Includes exercise-specific reading notes</tspan></text><path d="M1130,663 L1130,700" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="705" width="690" height="220" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="747" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Economical LLM</tspan></text><text x="812" y="790" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• e.g., OpenAI GPT-5.6 Luna</tspan></text><text x="812" y="832" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Selects supported issues and options</tspan></text><text x="812" y="874" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Returns supporting words and questions</tspan></text><path d="M1130,928 L1130,965" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="970" width="690" height="220" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1012" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Interpretation (JSON)</tspan></text><text x="812" y="1055" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Issues, options and quoted evidence</tspan></text><text x="812" y="1097" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Clarification questions</tspan></text><text x="812" y="1139" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Ideas retained without points</tspan></text><path d="M1130,1193 L1130,1230" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="1235" width="690" height="230" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1277" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Python script A2-2</tspan></text><text x="812" y="1320" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Applies fitted exercise-specific rules</tspan></text><text x="812" y="1362" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Checks the result and retrieves scores</tspan></text><text x="812" y="1404" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Records which custom rules were used</tspan></text><path d="M1130,1468 L1130,1505" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="1510" width="690" height="220" fill="white" stroke="black" stroke-width="3"/><text x="1130.0" y="1552" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Scored offer (JSON)</tspan></text><text x="812" y="1595" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Scores by issue and option</tspan></text><text x="812" y="1637" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Role-specific totals when complete</tspan></text><text x="812" y="1679" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Clarifications and unpriced ideas</tspan></text></svg>