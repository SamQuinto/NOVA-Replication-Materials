<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="2521" viewBox="0 0 1510 2521"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380" dy="0">A1  Flexible</tspan><tspan x="380" dy="39.06">Higher API cost</tspan></text><rect x="35" y="115" width="690" height="490" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Offer data and exercise files</tspan></text><text x="62" y="200" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Offer text entered in the free-text box</tspan></text><text x="62" y="242" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Negotiator’s assigned role</tspan></text><text x="62" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Role materials and scoring table (JSON</tspan><tspan x="62" dy="34.02">  files)</tspan></text><text x="62" y="360" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• General-purpose prompt containing the main</tspan><tspan x="62" dy="34.02">  instructions (text file)</tspan></text><text x="62" y="436" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Optional: Previous offer text, when</tspan><tspan x="62" dy="34.02">  referenced—for example, “Keep everything</tspan><tspan x="62" dy="34.02">  from the previous offer, but change the</tspan><tspan x="62" dy="34.02">  salary to $60,000.”</tspan></text><path d="M380,608 L380,645" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="650" width="690" height="296" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Python script A1-1</tspan></text><text x="62" y="735" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">Combines the inputs above, including all</tspan><tspan x="62" dy="34.02">issues and options from the scoring table,</tspan><tspan x="62" dy="34.02">into one JSON request sent to the LLM.</tspan></text><path d="M380,949 L380,986" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="991" width="690" height="346" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1033" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Advanced LLM</tspan></text><text x="62" y="1076" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">(e.g., OpenAI GPT-6.1 Sol)</tspan></text><text x="62" y="1118" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Processes the JSON request prepared above</tspan></text><text x="62" y="1160" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Identifies the proposed issues and matches</tspan><tspan x="62" dy="34.02">  them to available options in the scoring</tspan><tspan x="62" dy="34.02">  table</tspan></text><text x="62" y="1270" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Returns its interpretation as JSON</tspan></text><path d="M380,1340 L380,1377" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="1382" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1424" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Interpretation (JSON)</tspan></text><text x="62" y="1467" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Identified issues and their interpreted</tspan><tspan x="62" dy="34.02">  options</tspan></text><text x="62" y="1543" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Words quoted from the offer to support</tspan><tspan x="62" dy="34.02">  each interpretation</tspan></text><text x="62" y="1619" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Clarification questions and ideas retained</tspan><tspan x="62" dy="34.02">  without scores, if needed</tspan></text><path d="M380,1723 L380,1760" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="1765" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1807" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Python script A1-2</tspan></text><text x="62" y="1850" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Checks the interpretation above for</tspan><tspan x="62" dy="34.02">  supporting quotations, valid issues and</tspan><tspan x="62" dy="34.02">  options, and allowable values</tspan></text><text x="62" y="1960" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Looks up researcher-defined scores in the</tspan><tspan x="62" dy="34.02">  scoring table and calculates totals</tspan></text><text x="62" y="2036" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Returns the scored offer as JSON</tspan></text><path d="M380,2106 L380,2143" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="2148" width="690" height="338" fill="white" stroke="black" stroke-width="3"/><text x="380.0" y="2190" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Scored offer (JSON)</tspan></text><text x="62" y="2233" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Interpreted issues and options, with their</tspan><tspan x="62" dy="34.02">  individual scores</tspan></text><text x="62" y="2309" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Each negotiator’s total score when the</tspan><tspan x="62" dy="34.02">  offer is complete and valid</tspan></text><text x="62" y="2385" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Clarification questions and unscored</tspan><tspan x="62" dy="34.02">  ideas, if any</tspan></text><text x="1130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130" dy="0">A2  Customized</tspan><tspan x="1130" dy="39.06">Higher setup effort, lower API cost</tspan></text><rect x="785" y="115" width="690" height="490" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="157" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Offer data and exercise files</tspan></text><text x="812" y="200" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Offer text entered in the free-text box</tspan></text><text x="812" y="242" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Negotiator’s assigned role</tspan></text><text x="812" y="284" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Role materials, scoring table and matching</tspan><tspan x="812" dy="34.02">  vocabulary (JSON files)</tspan></text><text x="812" y="360" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Main instructions (text file) and</tspan><tspan x="812" dy="34.02">  exercise-specific reading instructions</tspan><tspan x="812" dy="34.02">  (JSON file)</tspan></text><text x="812" y="470" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Optional: Previous offer text, when the</tspan><tspan x="812" dy="34.02">  current offer refers to it</tspan></text><path d="M1130,608 L1130,645" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="650" width="690" height="296" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="692" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Python script A2-1</tspan></text><text x="812" y="735" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Uses matching rules to select relevant</tspan><tspan x="812" dy="34.02">  issues and options from the scoring table</tspan></text><text x="812" y="811" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Combines these entries with the offer,</tspan><tspan x="812" dy="34.02">  role materials and instructions into one</tspan><tspan x="812" dy="34.02">  JSON request sent to the LLM</tspan></text><path d="M1130,949 L1130,986" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="991" width="690" height="346" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1033" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Economical LLM</tspan></text><text x="812" y="1076" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">(e.g., OpenAI GPT-5.6 Luna)</tspan></text><text x="812" y="1118" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Processes the JSON request prepared above</tspan></text><text x="812" y="1160" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Identifies the proposed issues and matches</tspan><tspan x="812" dy="34.02">  them to the selected scoring-table options</tspan></text><text x="812" y="1236" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Returns its interpretation as JSON</tspan></text><path d="M1130,1340 L1130,1377" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="1382" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1424" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Interpretation (JSON)</tspan></text><text x="812" y="1467" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Identified issues and their interpreted</tspan><tspan x="812" dy="34.02">  options</tspan></text><text x="812" y="1543" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Words quoted from the offer to support</tspan><tspan x="812" dy="34.02">  each interpretation</tspan></text><text x="812" y="1619" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Clarification questions and ideas retained</tspan><tspan x="812" dy="34.02">  without scores, if needed</tspan></text><path d="M1130,1723 L1130,1760" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="1765" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1807" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Python script A2-2</tspan></text><text x="812" y="1850" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Applies exercise-specific Python rules to</tspan><tspan x="812" dy="34.02">  the interpretation above</tspan></text><text x="812" y="1926" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Checks quotations, issues, options and</tspan><tspan x="812" dy="34.02">  values, then looks up assigned scores and</tspan><tspan x="812" dy="34.02">  calculates totals</tspan></text><text x="812" y="2036" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Returns the scored offer as JSON</tspan></text><path d="M1130,2106 L1130,2143" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="2148" width="690" height="338" fill="white" stroke="black" stroke-width="3"/><text x="1130.0" y="2190" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Scored offer (JSON)</tspan></text><text x="812" y="2233" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Interpreted issues and options, with their</tspan><tspan x="812" dy="34.02">  individual scores</tspan></text><text x="812" y="2309" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Each negotiator’s total score when the</tspan><tspan x="812" dy="34.02">  offer is complete and valid</tspan></text><text x="812" y="2385" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Clarification questions and unscored</tspan><tspan x="812" dy="34.02">  ideas, if any</tspan></text></svg>