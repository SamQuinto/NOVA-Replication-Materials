<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="2517" viewBox="0 0 1510 2517"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="black"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="380" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380" dy="0">A1 - Flexible, Higher API cost</tspan></text><rect x="35" y="85" width="690" height="524" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Initial Inputs: Offer text and exercise files</tspan></text><text x="62" y="170" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Offer text entered in the free-text box</tspan></text><text x="62" y="212" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Negotiator’s assigned role</tspan></text><text x="62" y="254" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Role materials and scoring table (JSON</tspan><tspan x="62" dy="34.02">  files)</tspan></text><text x="62" y="330" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• General-purpose prompt containing the main</tspan><tspan x="62" dy="34.02">  instructions (text file)</tspan></text><text x="62" y="406" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Optional: Previous offer text, when</tspan><tspan x="62" dy="34.02">  referenced—for example, “Keep everything</tspan><tspan x="62" dy="34.02">  from the previous offer, but change the</tspan><tspan x="62" dy="34.02">  salary to $60,000.”</tspan></text><path d="M380,612 L380,649" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="654" width="690" height="296" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="696" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Python script A1-1</tspan></text><text x="62" y="739" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">Combines the inputs above, including all</tspan><tspan x="62" dy="34.02">issues and options from the scoring table,</tspan><tspan x="62" dy="34.02">into one JSON request sent to the LLM.</tspan></text><path d="M380,953 L380,990" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="995" width="690" height="346" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1037" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Advanced LLM</tspan></text><text x="62" y="1080" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">(e.g., OpenAI GPT-6.1 Sol)</tspan></text><text x="62" y="1122" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Processes the JSON request prepared above</tspan></text><text x="62" y="1164" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Identifies the proposed issues and matches</tspan><tspan x="62" dy="34.02">  them to available options in the scoring</tspan><tspan x="62" dy="34.02">  table</tspan></text><text x="62" y="1274" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Returns its interpretation as JSON</tspan></text><path d="M380,1344 L380,1381" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="1386" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1428" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Interpretation (JSON)</tspan></text><text x="62" y="1471" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Identified issues and their interpreted</tspan><tspan x="62" dy="34.02">  options</tspan></text><text x="62" y="1547" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Words quoted from the offer to support</tspan><tspan x="62" dy="34.02">  each interpretation</tspan></text><text x="62" y="1623" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Clarification questions and ideas retained</tspan><tspan x="62" dy="34.02">  without scores, if needed</tspan></text><path d="M380,1727 L380,1764" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="1769" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="380.0" y="1811" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Python script A1-2</tspan></text><text x="62" y="1854" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Checks the interpretation above for</tspan><tspan x="62" dy="34.02">  supporting quotations, valid issues and</tspan><tspan x="62" dy="34.02">  options, and allowable values</tspan></text><text x="62" y="1964" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Looks up researcher-defined scores in the</tspan><tspan x="62" dy="34.02">  scoring table and calculates totals</tspan></text><text x="62" y="2040" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Returns the scored offer as JSON</tspan></text><path d="M380,2110 L380,2147" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="35" y="2152" width="690" height="330" fill="white" stroke="black" stroke-width="3"/><text x="380.0" y="2194" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="380.0" dy="0">Scored offer (JSON)</tspan></text><text x="62" y="2237" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Shows each negotiator’s scores for</tspan><tspan x="62" dy="34.02">  interpreted issues and options, with</tspan><tspan x="62" dy="34.02">  totals when the offer is complete and</tspan><tspan x="62" dy="34.02">  valid</tspan></text><text x="62" y="2381" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="62" dy="0">• Includes clarification questions and</tspan><tspan x="62" dy="34.02">  unscored ideas, if any</tspan></text><text x="1130" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130" dy="0">A2 - Customized, Lower API cost</tspan></text><rect x="785" y="85" width="690" height="524" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="127" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Offer data and exercise files</tspan></text><text x="812" y="170" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Offer text entered in the free-text box</tspan></text><text x="812" y="212" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Negotiator’s assigned role</tspan></text><text x="812" y="254" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Role materials, scoring table and matching</tspan><tspan x="812" dy="34.02">  vocabulary (JSON files)</tspan></text><text x="812" y="330" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Main instructions (text file) and</tspan><tspan x="812" dy="34.02">  exercise-specific reading instructions</tspan><tspan x="812" dy="34.02">  (JSON file)</tspan></text><text x="812" y="440" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Optional: Previous offer text, when</tspan><tspan x="812" dy="34.02">  referenced—for example, “Keep everything</tspan><tspan x="812" dy="34.02">  from the previous offer, but change the</tspan><tspan x="812" dy="34.02">  salary to $60,000.”</tspan></text><path d="M1130,612 L1130,649" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="654" width="690" height="296" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="696" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Python script A2-1</tspan></text><text x="812" y="739" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Uses matching rules to select relevant</tspan><tspan x="812" dy="34.02">  issues and options from the scoring table</tspan></text><text x="812" y="815" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Combines these entries with the offer,</tspan><tspan x="812" dy="34.02">  role materials and instructions into one</tspan><tspan x="812" dy="34.02">  JSON request sent to the LLM</tspan></text><path d="M1130,953 L1130,990" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="995" width="690" height="346" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1037" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Economical LLM</tspan></text><text x="812" y="1080" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">(e.g., OpenAI GPT-5.6 Luna)</tspan></text><text x="812" y="1122" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Processes the JSON request prepared above</tspan></text><text x="812" y="1164" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Identifies the proposed issues and matches</tspan><tspan x="812" dy="34.02">  them to the selected scoring-table options</tspan></text><text x="812" y="1240" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Returns its interpretation as JSON</tspan></text><path d="M1130,1344 L1130,1381" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="1386" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1428" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Interpretation (JSON)</tspan></text><text x="812" y="1471" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Identified issues and their interpreted</tspan><tspan x="812" dy="34.02">  options</tspan></text><text x="812" y="1547" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Words quoted from the offer to support</tspan><tspan x="812" dy="34.02">  each interpretation</tspan></text><text x="812" y="1623" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Clarification questions and ideas retained</tspan><tspan x="812" dy="34.02">  without scores, if needed</tspan></text><path d="M1130,1727 L1130,1764" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="1769" width="690" height="338" fill="white" stroke="black" stroke-width="1.8"/><text x="1130.0" y="1811" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Python script A2-2</tspan></text><text x="812" y="1854" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Applies exercise-specific Python rules to</tspan><tspan x="812" dy="34.02">  the interpretation above</tspan></text><text x="812" y="1930" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Checks quotations, issues, options and</tspan><tspan x="812" dy="34.02">  values, then looks up assigned scores and</tspan><tspan x="812" dy="34.02">  calculates totals</tspan></text><text x="812" y="2040" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Returns the scored offer as JSON</tspan></text><path d="M1130,2110 L1130,2147" fill="none" stroke="black" stroke-width="2.3" marker-end="url(#arrow)"/><rect x="785" y="2152" width="690" height="330" fill="white" stroke="black" stroke-width="3"/><text x="1130.0" y="2194" text-anchor="middle" font-family="Arial, sans-serif" font-size="31" font-weight="bold"><tspan x="1130.0" dy="0">Scored offer (JSON)</tspan></text><text x="812" y="2237" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Shows each negotiator’s scores for</tspan><tspan x="812" dy="34.02">  interpreted issues and options, with</tspan><tspan x="812" dy="34.02">  totals when the offer is complete and</tspan><tspan x="812" dy="34.02">  valid</tspan></text><text x="812" y="2381" text-anchor="start" font-family="Arial, sans-serif" font-size="27"><tspan x="812" dy="0">• Includes clarification questions and</tspan><tspan x="812" dy="34.02">  unscored ideas, if any</tspan></text></svg>